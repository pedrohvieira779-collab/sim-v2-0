<html lang="pt-BR">

<title>Guardiões do Cerrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07070d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-family:'Press Start 2P',monospace}
#wrap{position:relative;flex:none;box-shadow:0 0 0 2px #222,0 8px 30px #000}
#screen{position:absolute;left:0;top:0;width:256px;height:224px;transform-origin:0 0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:256px;height:224px;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:8px;line-height:11px}
.win{position:absolute;background:linear-gradient(180deg,#4664dc 0%,#22309a 55%,#141c68 100%);border:2px solid #eef0ff;border-radius:4px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #0008;padding:5px 6px 4px;color:#fff;text-shadow:1px 1px 0 #000}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.opt{position:relative;padding-left:10px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;white-space:nowrap;line-height:11px}
.opt.sel::before{content:'';position:absolute;left:0;top:2px;border-left:6px solid #fff;border-top:3px solid transparent;border-bottom:3px solid transparent;animation:blink .5s steps(2) infinite}
.opt.dis{color:#8a92c0}
.ttl,.hl{color:#ffe070}.crit{color:#ffb020}.bad{color:#ff8080}.good{color:#90ff90}
.row{display:flex;justify-content:space-between}
.bar{height:3px;background:#000;margin:1px 0 2px;box-shadow:0 0 0 1px #fff5}
.bar i{display:block;height:100%;background:#58d858}.bar.pm i{background:#58a8ff}.bar.xp i{background:#ffd040}
.tag{padding:2px 6px;color:#ffe070}
.por{float:left;width:36px;height:36px;image-rendering:pixelated;margin:0 6px 2px 0;background:#0006;box-shadow:0 0 0 1px #fff6}
.more{position:absolute;right:6px;bottom:4px;border-top:5px solid #fff;border-left:4px solid transparent;border-right:4px solid transparent;animation:blink .5s steps(2) infinite}
.toast{left:50%!important;transform:translateX(-50%);white-space:nowrap;pointer-events:none;animation:toast 2.6s forwards}
.mini{pointer-events:none;opacity:.92;padding:3px 5px}
.sts span{margin-right:4px}
@keyframes blink{50%{opacity:0}}
@keyframes toast{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
#pad{display:none;width:100%;max-width:420px;justify-content:space-between;align-items:center;padding:0 18px;flex:none}
#pad button{font:bold 18px system-ui,sans-serif;color:#ddd;background:#2a2a3a;border:2px solid #555;border-radius:10px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px}
.dpad [data-k=up]{grid-area:1/2}.dpad [data-k=left]{grid-area:2/1}.dpad [data-k=right]{grid-area:2/3}.dpad [data-k=down]{grid-area:3/2}
.ab{display:flex;gap:14px;align-items:center}.ab button{width:62px;height:62px;border-radius:50%!important}
.ab [data-k=a]{background:#7a2030!important;margin-bottom:30px}.ab [data-k=b]{background:#20307a!important}
#hint{font-size:8px;color:#7880a8;text-align:center;line-height:14px;padding:0 8px}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}}
</style>
</head>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerpCol=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
const shade=(h,a)=>'#'+hex(h).map(v=>clamp(v+a,0,255).toString(16).padStart(2,'0')).join('');
const sgn=(n,hide0)=>n>0?'+'+n:n<0?''+n:(hide0?'':'+0');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- Dados (rolagem) ----------
function parseDice(e){const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(e);return {n:+m[1],s:+m[2],b:+(m[3]||0)};}
function roll(e,crit=false){const d=parseDice(e),n=crit?d.n*2:d.n,r=[];for(let i=0;i<n;i++)r.push(1+R(d.s));
  const total=r.reduce((a,c)=>a+c,0)+d.b;return {r,total,txt:`${n}d${d.s}[${r.join(',')}]${d.b?sgn(d.b):''}`};}

// ---------- Desenho de pixels ----------
function pcirc(c,x,y,r,col,ry=r){c.fillStyle=col;ry=Math.max(1,ry);for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(r*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));c.fillRect(Math.round(x-hw),Math.round(y+dy),hw*2+1,1);}}
function pline(c,x0,y0,x1,y1,col){c.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)c.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1);}
function txt(s,x,y,col='#fff',size=8,align='center',c=g){c.font=`${size}px "Press Start 2P", monospace`;c.textAlign=align;c.textBaseline='middle';c.fillStyle='#000';
  for(const [a,b] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])c.fillText(s,x+a,y+b);c.fillStyle=col;c.fillText(s,x,y);}

const OUT='#140c18';
const SPR={};
function buildSprites(){
  for(const [key,def] of Object.entries(SP)){
    const base=def.base?SP[def.base]:def, pal=def.pal, rows=base.rows, alt=base.alt;
    const frames=[rows]; if(alt) frames.push(rows.slice(0,rows.length-alt.length).concat(alt));
    const cs=frames.map(rs=>{const w=16,h=rs.length,c=mk(w+2,h+2),q=c.getContext('2d');
      const solid=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rs[y][x]&&rs[y][x]!=='.'&&pal[rs[y][x]];
      for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
        if(solid(x,y)){q.fillStyle=pal[rs[y][x]];q.fillRect(x+1,y+1,1,1);}
        else if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)){q.fillStyle=OUT;q.fillRect(x+1,y+1,1,1);}
      }return c;});
    const wc=mk(18,18),wq=wc.getContext('2d');wq.drawImage(cs[0],0,0);wq.globalCompositeOperation='source-in';wq.fillStyle='#fff';wq.fillRect(0,0,18,18);
    SPR[key]={f:cs,white:wc,noflip:!!(def.noflip||base.noflip)};
  }
}
// desenha com o centro dos pés em (cx, fy)
function drawSpr(c,key,cx,fy,sc=1,o={}){
  const s=SPR[key]; if(!s) return;
  const img=o.white?s.white:s.f[(o.frame||0)%s.f.length], w=img.width*sc, h=img.height*sc;
  const x=Math.round(cx-w/2), y=Math.round(fy-h+sc);
  if(o.alpha!=null) c.globalAlpha=o.alpha;
  if(o.flip&&!s.noflip){c.save();c.translate(x+w,y);c.scale(-1,1);c.drawImage(img,0,0,w,h);c.restore();}
  else c.drawImage(img,x,y,w,h);
  c.globalAlpha=1;
}
function shadow(c,x,y,r){c.fillStyle='rgba(0,0,0,.28)';pcirc(c,x,y,r,'rgba(0,0,0,.28)',Math.max(1,Math.round(r/3)));}

// Inimigos desenhados por código (fogo e fumaça)
function flame(q,x,y,w,h,t,px=1){px=Math.max(1,Math.round(px));
  for(const [col,f] of [['#b81e10',1],['#f06a14',.72],['#ffd040',.44],['#fff6c0',.2]]){q.fillStyle=col;const ww=w*f;
    for(let dx=-ww;dx<=ww;dx+=px){const n=dx/ww,hh=h*f*(1-n*n)*(.7+.3*Math.sin(t*9+dx*.4/px+f*5))+h*.12*f;q.fillRect(Math.round(x+dx),Math.round(y-hh),px,Math.round(hh));}}}
function eyes(q,x,y,s,angry){q.fillStyle='#200808';q.fillRect(Math.round(x-4*s),Math.round(y),Math.round(2*s),Math.round(3*s));q.fillRect(Math.round(x+2*s),Math.round(y),Math.round(2*s),Math.round(3*s));
  q.fillStyle='#fff';q.fillRect(Math.round(x-4*s),Math.round(y),Math.max(1,Math.round(s)),Math.max(1,Math.round(s)));q.fillRect(Math.round(x+2*s),Math.round(y),Math.max(1,Math.round(s)),Math.max(1,Math.round(s)));
  if(angry){q.fillStyle='#200808';q.fillRect(Math.round(x-5*s),Math.round(y-2*s),Math.round(3*s),Math.max(1,Math.round(s)));q.fillRect(Math.round(x+2*s),Math.round(y-2*s),Math.round(3*s),Math.max(1,Math.round(s)));}}

const MW=26, MH=20, MCX=13, MCY=10;
const WALK=new Set(['.',',','"','=','x']);
const DYN=new Set(['~','"','F','G','P','c']);
function genMap(id){
  const s=SPECS[id], rr=mulberry(s.seed), T=[];
  for(let y=0;y<MH;y++){T.push([]);for(let x=0;x<MW;x++)T[y].push(s.ground);}
  const set=(x,y,c)=>{if(x>0&&y>0&&x<MW-1&&y<MH-1)T[y][x]=c;};
  const blob=(c,cx,cy,rx,ry)=>{for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx+.5)+(y*y)/(ry*ry+.5)<=1+(rr()-.5)*.5)set(cx+x,cy+y,c);};
  const rp=()=>[2+Math.floor(rr()*(MW-4)),2+Math.floor(rr()*(MH-4))];
  for(let i=0;i<(s.grass||0);i++){const [x,y]=rp();blob('"',x,y,2+Math.floor(rr()*2),1+Math.floor(rr()*2));}
  for(let i=0;i<(s.water||0);i++){const [x,y]=rp();blob('~',x,y,2+Math.floor(rr()*2),1+Math.floor(rr()*2));}
  (s.ponds||[]).forEach(p=>blob('~',...p));
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(T[y][x]===s.ground){
    let r=rr(),acc=0;for(const [c,p] of Object.entries(s.scatter)){acc+=p;if(r<acc){T[y][x]=c;break;}}
    if(T[y][x]===s.ground&&rr()<s.flowers)T[y][x]=',';}
  for(let x=0;x<MW;x++){T[0][x]=s.wall;T[MH-1][x]=s.wall;}
  for(let y=0;y<MH;y++){T[y][0]=s.wall;T[y][MW-1]=s.wall;}
  const P=s.path||'=', carve=(x,y)=>{if(x>=0&&y>=0&&x<MW&&y<MH)T[y][x]=P;};
  const line=(x0,y0,x1,y1)=>{let x=x0,y=y0;carve(x,y);while(x!==x1){x+=Math.sign(x1-x);carve(x,y);}while(y!==y1){y+=Math.sign(y1-y);carve(x,y);}};
  const ex=s.exits;
  if(ex.n){for(let y=0;y<=3;y++){carve(12,y);carve(13,y);}line(13,3,MCX,MCY);}
  if(ex.s){for(let y=MH-4;y<MH;y++){carve(12,y);carve(13,y);}line(13,MH-4,MCX,MCY);}
  if(ex.w){for(let x=0;x<=3;x++){carve(x,9);carve(x,10);}line(3,10,MCX,MCY);}
  if(ex.e){for(let x=MW-4;x<MW;x++){carve(x,9);carve(x,10);}line(MW-4,10,MCX,MCY);}
  const spots=[...(s.chests||[]).map(c=>[c[0],c[1]]),s.H,s.P,s.boss&&s.boss.at,...Object.values(s.npcs||{})].filter(Boolean);
  for(const [x,y] of spots)line(MCX,MCY,x,y>MCY?y-1:y+1);
  for(const [x,y] of spots)T[y][x]=s.ground==='x'?'x':'.';
  (s.chests||[]).forEach(c=>T[c[1]][c[0]]='c');
  if(s.H)T[s.H[1]][s.H[0]]='H';
  if(s.P)T[s.P[1]][s.P[0]]='P';
  if(s.gate)for(let y=0;y<=2;y++){T[y][12]='G';T[y][13]='G';}
  return {id,spec:s,name:s.name,t:T,w:MW,h:MH,pal:PALS[id],seed:s.seed,exits:ex,enc:s.enc,music:s.music,bg:s.bg,gate:!!s.gate};
}

function ground(q,X,Y,P,rr){q.fillStyle=P.g;q.fillRect(X,Y,16,16);for(let i=0;i<10;i++){q.fillStyle=rr()<.5?P.gd:P.gl;q.fillRect(X+Math.floor(rr()*16),Y+Math.floor(rr()*16),1,1+Math.floor(rr()*2));}}
function burnt(q,X,Y,rr){q.fillStyle='#3a2c24';q.fillRect(X,Y,16,16);for(let i=0;i<12;i++){const r=rr();q.fillStyle=r<.4?'#2a1e18':r<.85?'#5a4e48':'#c8481a';q.fillRect(X+Math.floor(rr()*16),Y+Math.floor(rr()*16),1,1);}}
function tree(q,X,Y,rr,c1,c2,c3){q.fillStyle='rgba(0,0,0,.22)';q.fillRect(X+3,Y+14,10,2);
  q.fillStyle='#5a3a20';q.fillRect(X+7,Y+9,2,6);q.fillRect(X+6,Y+12,1,2);q.fillRect(X+9,Y+10,1,2);q.fillRect(X+5,Y+11,1,1);
  pcirc(q,X+8,Y+6,6,c3,5);pcirc(q,X+7,Y+5,5,c2,4);pcirc(q,X+6,Y+4,2,c1,2);
  for(let i=0;i<6;i++){q.fillStyle=rr()<.5?c1:c3;q.fillRect(X+3+Math.floor(rr()*10),Y+2+Math.floor(rr()*8),1,1);}}
function buriti(q,X,Y,rr){q.fillStyle='rgba(0,0,0,.22)';q.fillRect(X+4,Y+14,8,2);
  q.fillStyle='#7a5a3a';q.fillRect(X+7,Y+6,2,9);q.fillStyle='#5a3e26';for(let y=7;y<15;y+=2)q.fillRect(X+7,Y+y,2,1);
  for(const [dx,dy] of [[-7,-2],[-6,-5],[-3,-6],[0,-7],[3,-6],[6,-5],[7,-2],[-6,1],[6,1]]){pline(q,X+8,Y+5,X+8+dx,Y+5+dy,'#3f8a2a');q.fillStyle='#7cd050';q.fillRect(X+8+dx,Y+5+dy,1,1);}
  q.fillStyle='#8a3a1a';q.fillRect(X+6,Y+7,2,2);q.fillRect(X+9,Y+7,2,2);}
function cupim(q,X,Y,rr){q.fillStyle='rgba(0,0,0,.22)';q.fillRect(X+2,Y+14,12,2);
  for(let y=3;y<=15;y++){const hw=Math.round(1+(y-3)*.45);q.fillStyle='#c88a54';q.fillRect(X+8-hw,Y+y,1,1);q.fillStyle='#b06a3a';q.fillRect(X+9-hw,Y+y,hw*2-1,1);q.fillStyle='#8a4a24';q.fillRect(X+7+hw,Y+y,1,1);}
  q.fillStyle='#5a2a10';q.fillRect(X+7,Y+8,1,1);q.fillRect(X+9,Y+11,1,1);q.fillRect(X+6,Y+13,1,1);}
function rock(q,X,Y){q.fillStyle='rgba(0,0,0,.22)';q.fillRect(X+3,Y+14,11,2);pcirc(q,X+8,Y+10,5,'#5a5a64',4);pcirc(q,X+7,Y+9,4,'#8a8a94',3);pcirc(q,X+6,Y+8,2,'#b8b8c4',1);}
function cliff(q,X,Y,rr){q.fillStyle='#7a5a3e';q.fillRect(X,Y,16,16);q.fillStyle='#5a3e28';for(let y=3;y<16;y+=4)q.fillRect(X,Y+y,16,1);q.fillStyle='#9a7a54';q.fillRect(X,Y,16,2);
  for(let i=0;i<4;i++){q.fillStyle='#4a301e';q.fillRect(X+Math.floor(rr()*15),Y+2+Math.floor(rr()*13),1,2);}}
function toca(q,X,Y){pcirc(q,X+8,Y+10,7,'#8a6a40',5);pcirc(q,X+8,Y+9,6,'#a8844e',4);pcirc(q,X+8,Y+11,4,'#1a1008',3);q.fillStyle='#4a8a30';q.fillRect(X+4,Y+4,1,2);q.fillRect(X+11,Y+5,1,2);}
function paintTile(q,ch,tx,ty,M){
  const X=tx*16,Y=ty*16,P=M.pal,rr=mulberry(tx*7919+ty*104729+M.seed*31);
  const gr=()=>M.spec.ground==='x'?burnt(q,X,Y,rr):ground(q,X,Y,P,rr);

    p.x+=p.vx*dt+(p.sw?Math.sin(T*2+p.sw)*.3:0);p.y+=p.vy*dt;}

}

const SPIRAL=(()=>{const W=16,Hh=14,o=[];let x0=0,y0=0,x1=W-1,y1=Hh-1;while(x0<=x1&&y0<=y1){for(let x=x0;x<=x1;x++)o.push([x,y0]);y0++;for(let y=y0;y<=y1;y++)o.push([x1,y]);x1--;if(y0<=y1){for(let x=x1;x>=x0;x--)o.push([x,y1]);y1--;}if(x0<=x1){for(let y=y1;y>=y0;y--)o.push([x0,y]);x0++;}}return o;})();
function drawTrans(){const p=trans.ms?clamp((now()-trans.t0)/trans.ms,0,1):1,n=Math.floor(p*SPIRAL.length);g.fillStyle='#000';for(let i=0;i<n;i++){const [x,y]=SPIRAL[i];g.fillRect(x*16,y*16,16,16);}}

  g.restore();

  bhud();return false;}
async function chooseTarget(){const alive=B.foes.map((f,i)=>[f,i]).filter(([f])=>!f.dead);if(alive.length===1)return alive[0][1];
  const r=await pick(alive.map(([f])=>({label:f.name,right:`${f.hp}PV`})),{x:4,y:92,w:150,title:'Alvo',onMove:k=>B.target=alive[k][1]});B.target=-1;return r<0?-1:alive[r][1];}
async function foeResist(f,st){const d=1+R(20);await diceAnim(d,20);const b=f.d.boss?3:0;
  if(d+b>=12){await msg(`${f.name} resiste: d20 ${d}${b?sgn(b):''} vs CD 12.`,900);return;}
  f.st[st]=st==='atordoado'?1:3;fx(st==='veneno'?'veneno':'fumaca',f.x,f.y-8*f.sc);await msg(`${f.name} ficou ${ST[st][2]}! (d20 ${d}${b?sgn(b):''} vs CD 12)`,1000);}
async function heroAttack(ti){const s=S();bmsg(`${H.name} ataca ${B.foes[ti].name}!`);return strike(H,B.foes[ti],{bonus:s.atk,dmg:HEROES[H.key].die,dmgB:s.dmg});}
async function useSkill(k){const s=SKILLS[k];let ti=-1;if(s.t){ti=await chooseTarget();if(ti<0)return false;}
  H.pm-=s.pm;bhud();sfx('magic');fx('buff',B.hx,B.hy-24);await msg(`${H.name} usa <span class="hl">${s.n}</span>!`,700);const st=S();
  if(s.type==='phys'){const f=B.foes[ti],r=await strike(H,f,{bonus:st.atk,dmg:s.dmg,dmgB:st.dmg,critMin:s.crit});if(r.hit&&s.st&&!f.dead)await foeResist(f,s.st);}
  else if(s.type==='phys2'){for(let n=0;n<2;n++){if(B.foes[ti].dead){ti=B.foes.findIndex(x=>!x.dead);if(ti<0)break;}await strike(H,B.foes[ti],{bonus:S().atk,dmg:HEROES[H.key].die,dmgB:S().dmg});}}
  else if(s.type==='guard'){H.st.enrolado=1;const r=roll('1d8'),v=healH(r.total+st.sab);fx('cura',B.hx,B.hy-20);num(H,'+'+v,'#70ff70');sfx('heal');await msg(`CA +6 até o próximo turno. Cura ${r.txt}${sgn(st.sab)} = +${v} PV`,1200);}
  else if(s.type==='buff'){H.st[s.st]=3;fx('buff',B.hx,B.hy-24);await msg(s.st==='furia'?'Fúria! +2 em acerto e dano por 3 turnos.':'Escudo! CA +3 por 3 turnos.',1000);}
  else if(s.type==='heal'){const r=roll(s.dmg),v=healH(r.total+st.sab);if(s.cure){delete H.st.veneno;delete H.st.queimadura;}fx('cura',B.hx,B.hy-20);num(H,'+'+v,'#70ff70');sfx('heal');await msg(`Cura ${r.txt}${sgn(st.sab)} = +${v} PV`,1200);}
  else if(s.type==='magic'){const tg=s.aoe?B.foes.filter(f=>!f.dead):[B.foes[ti]];
    for(const f of tg){if(f.dead)continue;const r=roll(s.dmg),m=elMul(f,s.el);const dmg=Math.floor((r.total+st.sab)*m.mul);fx(FXEL[s.el],f.x,f.y-8*f.sc);if(s.el==='agua'||s.el==='vento')flash(.2);await sleep(260);
      await hurt(f,dmg,false,'hit');await msg(`${f.name}: ${r.txt}${sgn(st.sab)} = <b class="hl">${dmg}</b>${m.tag}`,1050);await checkDeath(f);
      if(s.st&&!f.dead)await foeResist(f,s.st);}}
  bhud();return true;}
async function skillMenu(){const ks=known();const i=await pick(ks.map(k=>({label:SKILLS[k].n,right:SKILLS[k].pm+'PM',dis:H.pm<SKILLS[k].pm,desc:SKILLS[k].desc})),{x:40,y:50,w:212,h:100,desc:true,title:`PM ${H.pm}/${S().mpm}`});
  if(i<0)return false;return useSkill(ks[i]);}
async function itemMenu(){const ks=Object.keys(H.inv).filter(k=>ITEMS[k].type==='use'&&H.inv[k]>0);if(!ks.length){await msg('Você não tem itens de uso.',800);return false;}
  const i=await pick(ks.map(k=>({label:ITEMS[k].n,right:'x'+H.inv[k],desc:ITEMS[k].desc})),{x:40,y:50,w:212,h:100,desc:true});if(i<0)return false;
  const r=useItem(ks[i]);fx('cura',B.hx,B.hy-20);sfx('heal');if(r.hp)num(H,'+'+r.hp,'#70ff70');else if(r.pm)num(H,'+'+r.pm,'#70c0ff');bhud();await msg(r.txt,1200);return true;}
async function heroTurn(){delete H.st.def;delete H.st.enrolado;if(await tick(H))return;
  for(;;){bhud();bmsg(`Vez de ${H.name}. O que fazer?`);
    const c=await pick([{label:'Atacar'},{label:'Habilid.'},{label:'Itens'},{label:'Defender'},{label:'Fugir',dis:B.boss}],{x:4,y:156,w:86,cancel:false,start:B.lastCmd||0});B.lastCmd=c;
    if(c===0){const t=await chooseTarget();if(t<0)continue;await heroAttack(t);return;}
    if(c===1){if(await skillMenu())return;continue;}
    if(c===2){if(await itemMenu())return;continue;}
    if(c===3){H.st.def=1;H.pm=Math.min(S().mpm,H.pm+1);fx('buff',B.hx,B.hy-24);sfx('magic');bhud();await msg(`${H.name} se defende (CA +4) e recupera 1 PM.`,900);return;}
    if(c===4){const d=1+R(20);await diceAnim(d,20);const tot=d+S().des;
      if(tot>=12||d===20){sfx('run');await msg(`Fuga: d20 ${d}${sgn(S().des)} = ${tot} vs CD 12 — Escapou!`,1000);return 'flee';}
      await msg(`Fuga: d20 ${d}${sgn(S().des)} = ${tot} vs CD 12 — Não deu!`,1000);return;}}}
function chooseAct(f){const alive=B.foes.filter(x=>!x.dead).length;
  const acts=f.d.acts.filter(a=>(a.kind!=='heal'||f.hp<f.mhp*.5)&&(a.kind!=='summon'||alive<3)&&(a.kind!=='buff'||!f.st[a.st]));
  let r=Math.random()*acts.reduce((s,a)=>s+a.w,0);for(const a of acts)if((r-=a.w)<0)return a;return acts[0];}
async function heroSave(a){const d=1+R(20);await diceAnim(d,20);const b=saveB(),tot=d+b;
  if(tot>=a.dc){await msg(`Resistência: d20 ${d}${sgn(b)} = ${tot} vs CD ${a.dc} — <span class="good">resistiu!</span>`,1000);return;}
  H.st[a.st]=a.st==='atordoado'?1:3;fx(a.st==='veneno'?'veneno':a.st==='queimadura'?'fogo':'fumaca',B.hx,B.hy-30);sfx('buzz');bhud();
  await msg(`Resistência: d20 ${d}${sgn(b)} = ${tot} vs CD ${a.dc} — <span class="bad">${ST[a.st][2]}!</span>`,1100);}
async function foeTurn(f){if(await tick(f))return;const a=chooseAct(f),fur=f.st.furia?2:0;
  bmsg(`${f.name}: <span class="hl">${a.n}</span>!`);await wait(550);
  if(a.kind==='buff'){f.st[a.st]=3;sfx('magic');fx('buff',f.x,f.y-8*f.sc);await msg(`${f.name} ficou ${ST[a.st][2]}! (${a.st==='furia'?'+2 ataque e dano':'CA +3'})`,950);return;}
  if(a.kind==='heal'){const r=roll(a.dmg),v=Math.min(f.mhp-f.hp,r.total);f.hp+=v;fx('cura',f.x,f.y-8*f.sc);num(f,'+'+v,'#70ff70');sfx('heal');await msg(`${f.name} se cura: ${r.txt} = +${v} PV`,1000);return;}
  if(a.kind==='summon'){const used=B.foes.filter(x=>!x.dead).map(x=>x.slot);const slot=[0,1,2].find(i=>!used.includes(i));const [x,y]=BOSS_MIN[slot];
    const nf=mkFoe(a.foe,x,y,3);nf.slot=slot;nf.init=1+R(20)+(nf.d.des||0);B.foes.push(nf);fx('fogo',x,y-20);sfx('fire');await msg(`Uma ${nf.name} surgiu das chamas!`,1000);return;}
  if(a.kind==='save'){fx('fumaca',B.hx,B.hy-30);return heroSave(a);}
  const r=await strike(f,H,{bonus:a.atk+fur,dmg:a.dmg,dmgB:fur,el:a.el});if(r.hit&&a.st&&H.hp>0)await heroSave(a);}
async function battleIntro(){sfx('enc');for(let i=0;i<2;i++){flash(1);await sleep(140);}trans={t0:now(),ms:D(520)};await sleep(540);fade=1;trans=null;}
async function battle(group,o={}){held=[];await battleIntro();clearUI();parts.length=0;nums.length=0;
  mode='battle';B={bg:o.bg||curMap.bg,foes:[],hx:198,hy:134,hflash:0,dice:null,target:-1,boss:!!o.boss};
  if(o.boss){const boss=mkFoe(group[0],74,142,4);boss.slot=-1;B.foes.push(boss);group.slice(1).forEach((k,i)=>{const f=mkFoe(k,BOSS_MIN[i][0],BOSS_MIN[i][1],3);f.slot=i;B.foes.push(f);});}
  else group.forEach((k,i)=>{const [x,y]=POS[group.length][i];const f=mkFoe(k,x,y,3);f.slot=i;B.foes.push(f);});
  B.msgEl=win(4,4,248);B.hudEl=win(92,156,160,64);bhud();
  music(o.boss?'boss':'battle');await fadeTo(0,250);
  const cnt={};group.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  await msg(Object.entries(cnt).map(([k,n])=>n>1?`${n}x ${FOES[k].n}`:FOES[k].n).join(', ')+(group.length>1?' apareceram!':' apareceu!'),1000);
  for(const k of Object.keys(cnt))if(!H.f.seen[k]){H.f.seen[k]=1;await msg(`<span class="hl">Bestiário: ${FOES[k].n}</span><br>${FOES[k].fact}`,3400);}
  const d=1+R(20);await diceAnim(d,20);B.hinit=d+S().des;B.foes.forEach(f=>f.init=1+R(20)+(f.d.des||0));
  const first=B.foes.every(f=>B.hinit>=f.init);
  await msg(`Iniciativa: d20 ${d}${sgn(S().des)} = ${B.hinit}. ${first?'Você age primeiro!':'Os inimigos são mais rápidos!'}`,1100);
  let res=null;
  while(!res){const order=[H,...B.foes.filter(f=>!f.dead)].sort((a,b)=>(b===H?B.hinit:b.init)-(a===H?B.hinit:a.init));
    for(const c of order){if(res)break;if(c!==H&&c.dead)continue;
      if(c===H){if((await heroTurn())==='flee')res='flee';}else await foeTurn(c);
      if(H.hp<=0)res='lose';else if(B.foes.every(f=>f.dead))res='win';}}
  H.st={};
  if(res==='win')await victory();
  if(res==='lose'){sfx('die');await msg(`${H.name} desmaiou...`,1600);}
  await fadeTo(1,350);clearUI();B=null;parts.length=0;nums.length=0;mode='world';
  if(res!=='lose'&&!o.final){music(curMap.music);await fadeTo(0,300);}
  return res;}
async function victory(){music('victory');let xp=0,gold=0;const drops=[];
  for(const f of B.foes){xp+=f.d.xp;if(f.d.gold)gold+=roll(f.d.gold).total;if(!f.d.boss&&Math.random()<.25)drops.push(['pequi','baru','mangaba'][R(3)]);}
  H.xp+=xp;H.gold+=gold;drops.forEach(k=>giveItem(k));fx('brilho',B.hx,B.hy-30);
  await msg(`<span class="hl">VITÓRIA!</span><br>+${xp} XP · +${gold} grãos${drops.length?'<br>Achou: '+drops.map(k=>ITEMS[k].n).join(', '):''}`,1800);
  await levelUps();}
async function levelUps(){while(H.lvl<10&&H.xp>=XP[H.lvl+1]){H.lvl++;const d=HEROES[H.key];sfx('level');fx('buff',B.hx,B.hy-24);fx('cura',B.hx,B.hy-20);flash(.3);
  const r=roll('1d'+d.hd),hpG=r.total+1,pmG=roll('1d4').total+1,stat=d.grow[(H.lvl-2)%3];H.mhp+=hpG;H.mpm+=pmG;H[stat]++;
  await diceAnim(r.r[0],d.hd);H.hp=S().mhp;H.pm=S().mpm;bhud();
  await msg(`<span class="hl">NÍVEL ${H.lvl}!</span><br>PV +${r.txt}+1 = ${hpG} · PM +${pmG}<br>${stat.toUpperCase()} +1 · PV e PM restaurados`,2400);
  for(const k of d.learn[H.lvl]||[]){sfx('item');await msg(`Aprendeu <span class="hl">${SKILLS[k].n}</span>!<br>${SKILLS[k].desc}`,1800);}}}

// =====================================================================
//  TELAS: TÍTULO, ESCOLHA, FINAL
// =====================================================================
let selIdx=0;
function drawTitle(){drawBG('titulo',T);palmS(26,SH,80,'#100818');palmS(232,SH,96,'#100818');palmS(208,SH,60,'#100818');
  g.fillStyle='#100818';g.fillRect(0,SH-20,SW,20);drawAmb();
  const y=44+Math.round(Math.sin(T*1.5)*2);txt('GUARDIOES',128,y,'#ffe070',16);g.font='16px "Press Start 2P", monospace';const tx=128-g.measureText('GUARDIOES').width/2+g.measureText('GUARDI').width;
  g.fillStyle='#000';g.fillRect(tx+3,y-15,11,4);g.fillStyle='#ffe070';g.fillRect(tx+4,y-14,3,1);g.fillRect(tx+6,y-13,3,1);g.fillRect(tx+9,y-14,3,1);txt('DO CERRADO',128,y+22,'#ffb040',16);
  txt('Um RPG com os bichos do Cerrado',128,y+46,'#ffe8d0',8);
  for(const [k,i] of [['lobo',0],['tamandua',1],['tatu',2],['seriema',3]])drawSpr(g,k,62+i*44,140+(Math.sin(T*3+i)>.5?-1:0),2,{frame:Math.floor(T*2+i)%2});}
function drawSelect(){drawBG('clareira',T);const ks=Object.keys(HEROES);
  ks.forEach((k,i)=>{const x=40+i*58,sel=i===selIdx,y=104+(sel?Math.round(-Math.abs(Math.sin(T*6))*6):0);shadow(g,x,104,14);
    drawSpr(g,HEROES[k].spr,x,y,2,{frame:sel?Math.floor(T*4)%2:0,alpha:sel?1:.75});
    if(sel){g.fillStyle='#fff';const ay=54+Math.round(Math.sin(T*8)*2);for(let j=0;j<5;j++)g.fillRect(x-4+j,ay+j,9-j*2,1);}});
  drawParts();}
function drawEnding(){drawBG('fim',T);const cast=[H.spr,'coruja','quati','arara','capivara','emaVelha','mirim'];
  cast.forEach((k,i)=>{const x=28+i*33;shadow(g,x,128,12);drawSpr(g,k,x,128+(Math.sin(T*4+i)>.7?-2:0),2,{frame:Math.floor(T*2+i)%2,flip:i>0});});
  if(T-endT>6){g.globalAlpha=Math.min(.5,(T-endT-6)/6);['#ff4040','#ffa040','#ffff60','#60e060','#4080ff','#a060e0'].forEach((c,i)=>{g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.arc(128,120,104-i*3,Math.PI,0);g.stroke();});g.globalAlpha=1;}
  drawAmb();}
let endT=0;
async function ending(){await fadeTo(1,600);mode='ending';endT=T;rainOn=true;clearUI();music('title');amb.length=0;await fadeTo(0,800);
  await say(['A chuva de verão finalmente caiu sobre a Chapada.','A Grande Queimada se apagou, virando só fumaça e cinzas.','Os bichos do Cerrado voltaram para suas tocas, ninhos e veredas.']);
  rainOn=false;
  await say([`${H.name}, você é o verdadeiro Guardião do Cerrado!`,`Sabia? ${FOES.queimada.fact}`,`E sobre você: ${HEROES[H.key].fact}`,'FIM — Obrigado por jogar! Você pode continuar explorando e completar o bestiário.']);
  H.f.won=true;H.map='clareira';H.x=6;H.y=6;save();await fadeTo(1,600);startWorld();await fadeTo(0,500);}
async function titleScreen(){mode='title';clearUI();music('title');amb.length=0;await fadeTo(0,500);
  const has=hasSave();const c=await pick([{label:'Novo jogo'},{label:'Continuar',dis:!has}],{x:88,y:168,w:84,cancel:false,start:has?1:0});
  if(c===1&&loadGame()){await fadeTo(1,300);startWorld();await fadeTo(0,300);return;}
  await fadeTo(1,300);await selectScreen();}
async function selectScreen(){mode='select';clearUI();selIdx=0;const ks=Object.keys(HEROES);await fadeTo(0,300);
  const top=win(4,4,248);
  const info=i=>{const d=HEROES[ks[i]];top.innerHTML=`<div class="ttl">${d.n}</div>${d.desc}<br>Magias e técnicas: ${d.learn[1].map(k=>SKILLS[k].n).join(', ')}`;};
  const c=await pick(ks.map(k=>{const d=HEROES[k];return {label:d.n,desc:`PV ${d.hp}<br>PM ${d.pm}<br>FOR ${sgn(d.for)}<br>DES ${sgn(d.des)}<br>SAB ${sgn(d.sab)}<br>CA ${d.ca}<br>Dano ${d.die}`};}),
    {x:2,y:140,w:162,cancel:false,desc:true,dx:166,dy:132,dw:88,title:'Seu guardião:',onMove:i=>{selIdx=i;info(i);}});
  top.remove();fx('brilho',40+c*58,80);sfx('level');await sleep(500);newHero(ks[c]);await fadeTo(1,400);startWorld();hero.dir='down';await fadeTo(0,400);
  await say(['Ainda bem que você acordou!','A seca de agosto chegou forte e uma Grande Queimada nasceu lá na Chapada.','A fumaça está confundindo os bichos. Até os guardiões da Vereda, do Campo Sujo e do Cerradão perderam o juízo.',
    'Acalme os três guardiões e traga as Sementes Sagradas: Buriti, Pequi e Ipê.','Com as três sementes, a chuva vai abrir o caminho até a Chapada.',
    'O Quati vende frutos e equipamentos. A Nascente cura e salva o progresso.','No capim alto aparecem bichos: lute para ganhar XP e grãos. Os dados decidem cada golpe!',
    'Setas para andar, Z/Enter para falar e confirmar, X/Esc para abrir o menu. Boa sorte!'],'Vovó Coruja','coruja');
  H.f.intro=true;}

// =====================================================================
//  INÍCIO
// =====================================================================
buildSprites();buildMaps();fit();requestAnimationFrame(loop);
const fontReady=document.fonts?Promise.race([document.fonts.load('8px "Press Start 2P"'),sleep(1500)]):Promise.resolve();
fontReady.then(()=>run(titleScreen));
</script>
